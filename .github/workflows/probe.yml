# API 응답 구조 확인용 수동 작업 (Actions 탭 → probe → Run workflow)
name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ITS
        env:
          ITS_KEY: ${{ secrets.ITS_KEY }}
        run: node scripts/probe-its.mjs
      - name: data.go.kr
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/probe-datago.mjs
      - name: life (opinet, foodsafety)
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
          FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: node scripts/probe-life.mjs
