# 소식을 모아 GitHub Pages에 배포한다.
#
# 수집 위치는 저장소 변수 COLLECTOR로 고른다 (Settings → Secrets and variables → Actions → Variables)
#   (없음)  : 이 작업이 10분마다 직접 수집한다. 필요한 Secrets: SAFETYDATA_KEY, KMA_APIHUB_KEY, DATA_GO_KR_KEY
#   server  : 국내 서버(server/run.sh)가 수집해 data 브랜치에 news.json을 올리고 repository_dispatch로 이 작업을 부른다.
#             일부 공공 API(예: ITS)는 해외(GitHub) IP에서 접속되지 않기 때문.
# 필요한 설정: Settings → Pages → Source: GitHub Actions
name: collect-and-deploy

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  repository_dispatch:
    types: [news-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 서버 수집 모드에서는 예약 실행을 건너뛴다 (서버가 배포를 요청한다)
    if: github.event_name != 'schedule' || vars.COLLECTOR != 'server'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parsers
        run: node --test "scripts/test/*.test.mjs"

      - name: Collect news
        if: vars.COLLECTOR != 'server'
        env:
          SAFETYDATA_KEY: ${{ secrets.SAFETYDATA_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BRIEF_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/news.json
        run: node scripts/collect.mjs

      - name: Use news from server (data branch)
        if: vars.COLLECTOR == 'server'
        run: |
          git fetch --depth=1 origin data
          git show origin/data:news.json > web/data/news.json
          node -e "const j=require('./web/data/news.json'); console.log('news.json', j.updated, j.items.length + '건', JSON.stringify(j.sources))"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
