# 10분마다 소식을 모아 GitHub Pages에 배포한다.
# 필요한 저장소 Secrets: SAFETYDATA_KEY, KMA_APIHUB_KEY, DATA_GO_KR_KEY
# 필요한 설정: Settings → Pages → Source: GitHub Actions
name: collect-and-deploy

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parsers
        run: node --test "scripts/test/*.test.mjs"

      - name: Collect news
        env:
          SAFETYDATA_KEY: ${{ secrets.SAFETYDATA_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/news.json
        run: node scripts/collect.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
