# 소식을 모아 GitHub Pages에 배포한다.
#
# 수집 위치는 저장소 변수 COLLECTOR로 고른다 (Settings → Secrets and variables → Actions → Variables)
#   (없음)  : 이 작업이 10분마다 직접 수집한다. 필요한 Secrets: SAFETYDATA_KEY, KMA_APIHUB_KEY, DATA_GO_KR_KEY
#   server  : 국내 서버(server/run.sh)가 수집해 data 브랜치에 news.json을 올리고 repository_dispatch로 이 작업을 부른다.
#             일부 공공 API(예: ITS)는 해외(GitHub) IP에서 접속되지 않기 때문.
# 필요한 설정: Settings → Pages → Source: GitHub Actions
name: collect-and-deploy

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  repository_dispatch:
    types: [news-updated]
  workflow_dispatch:
    inputs:
      force:
        description: '기름값·예보·식품안심업소·주차장 등 간격 두는 자료도 지금 새로 받기'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  primary:
    if: github.event_name != 'schedule' || vars.COLLECTOR != 'server'
    uses: ./.github/workflows/collector-attempt.yml
    with:
      runner: ubuntu-latest
      force: ${{ inputs.force || false }}
    secrets:
      SAFETYDATA_KEY: ${{ secrets.SAFETYDATA_KEY }}
      KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      OPINET_KEY: ${{ secrets.OPINET_KEY }}
      FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
  recovery:
    needs: primary
    if: ${{ !cancelled() && vars.COLLECTOR != 'server' }}
    uses: ./.github/workflows/collector-attempt.yml
    with:
      runner: macos-latest
      recovery: true
      force: ${{ inputs.force || false }}
    secrets:
      SAFETYDATA_KEY: ${{ secrets.SAFETYDATA_KEY }}
      KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      OPINET_KEY: ${{ secrets.OPINET_KEY }}
      FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
      SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
