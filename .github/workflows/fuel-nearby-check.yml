name: fuel-nearby-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-nearby-fuel.mjs
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
