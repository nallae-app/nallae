<!doctype html><html lang="ko"><meta charset="utf-8"><title>지삐 브랜드 배너</title><link rel="stylesheet" href="../web/fonts/wanted-sans/brand.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:1024px;height:500px;overflow:hidden}body{background:#FFF7E8;color:#0B1B33;font-family:'Wanted Sans',sans-serif;font-synthesis:none;--accent:#A93C00;--muted:#53666B}body.dark{background:#0B1B33;color:#FFF7E8;--accent:#FFB45C;--muted:#C4CCDA}.identity{position:absolute;left:64px;top:42px;display:flex;align-items:center;gap:20px}.identity img{width:116px;height:116px;object-fit:contain}.identity p{font-size:20px;font-weight:500;color:var(--muted)}.copy{position:absolute;left:68px;top:202px}.question{font-size:22px;font-weight:500;line-height:1.5;color:var(--muted);margin:0 0 18px}.promise{font-size:50px;font-weight:700;letter-spacing:-.035em;line-height:1.24;margin:0}.accent{color:var(--accent)}.phone{position:absolute;left:704px;top:28px;width:256px;height:444px;border:2px solid #3B4D65;border-radius:34px;background:#0B1B33;padding:12px 10px 14px;box-shadow:0 16px 32px #0002}.phone img{width:232px;height:412px;object-fit:cover;border-radius:23px;display:block}.dark .phone{border-color:#53647B}.dark .light-image,.dark-image,.phone .dark-image{display:none}.dark .dark-image{display:block}.dark .phone .light-image{display:none}
</style><body><div class="identity"><img class="light-image" src="../web/icons/icon-512.png" alt="지삐"><img class="dark-image" src="../web/icons/icon-dark-512.png" alt="지삐"><p>우리의 지기, 지삐</p></div><div class="copy"><p class="question">오늘 어디 갈지 모르겠어?</p><p class="promise"><span class="accent">지삐</span>지기와 함께라면<br>언제나 백전백승</p></div><div class="phone"><img class="light-image" src="screenshot-2-region.png" alt="지삐 실제 코스 화면"><img class="dark-image" src="screenshot-4-dark.png" alt="지삐 실제 다크 화면"></div><script>if(new URLSearchParams(location.search).get('theme')==='dark')document.body.classList.add('dark');if(new URLSearchParams(location.search).get('weight')==='750')document.querySelector('.promise').style.fontWeight='750';document.fonts.load('700 50px "Wanted Sans"').then(f=>{const m=document.createElement('meta');m.name='rendered-brand-font';m.content=f.map(x=>x.family+' / '+x.weight+' / '+x.status).join(';');document.head.append(m)});</script></body></html>
